services:
  - type: web
    name: querygenie
    runtime: docker
    repo: https://github.com/vandanabhatt854/sql_query_generator
    branch: main
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LLM_PROVIDER
        value: GOOGLE
      - key: GOOGLE_MODEL
        value: gemini-3.1-flash-lite
      - key: GOOGLE_API_KEY
        sync: false
      - key: SIMULATE_WRITES_ONLY
        value: "True"
      - key: COOKIE_SECURE
        value: "True"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DATA_DIR
        value: /app/data
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
